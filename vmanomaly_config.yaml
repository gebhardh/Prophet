# ============================================================
# VictoriaMetrics Anomaly Detection – Konfigurationsdatei
# ============================================================

# VictoriaMetrics Verbindung (Cluster-Modus: getrennte URLs für Lesen/Schreiben)
victoriametrics:
  read_url: "http://vmselect:8481/select/0/prometheus"   # vmselect
  write_url: "http://vminsert:8480/insert/0/prometheus"  # vminsert
  timeout: 30                      # HTTP-Timeout in Sekunden

# Anomalie-Erkennung: Abfrage-Konfiguration
queries:
  - name: "system_load5"
    promql: "system_load5{host='ubuntu'}"
    description: "System Load"

  - name: "mem_used_percent{host='ubuntu'}"
    promql: "mem_used_percent"
    description: "Memory-Auslastung in %"

  - name: "netstat_tcp_established"
    promql: "netstat_tcp_established{host='ubuntu'}"
    description: "netstat_tcp_established"

  - name: "network_traffic_in"
    promql: 'rate(net_bytes_recv{interface=~"wlp1s0|eth0|wlp4s0",host="ubuntu"})'
    description: "Netzwerk-Eingangsrate"

  - name: "network_traffic_sent"
    promql: 'rate(net_bytes_sent{interface=~"wlp1s0|eth0|wlp4s0",host="ubuntu"})'
    description: "Netzwerk-Ausgangsrate"


# Prophet-Modell Konfiguration
model:
  # Konfidenzintervall: 0.95 = 95% → engeres Band, mehr Anomalien
  #                    0.99 = 99% → weiteres Band, weniger Anomalien
  interval_width: 0.99

  # Saisonalitäten aktivieren
  yearly_seasonality: false        # Nur sinnvoll bei > 1 Jahr Daten
  weekly_seasonality: true
  daily_seasonality: true

  # Sensitivität für Trendwechsel (0.001=starr, 0.5=sehr flexibel)
  changepoint_prior_scale: 0.05

  # Sensitivität für Saisonalität
  seasonality_prior_scale: 10.0

  # Trainings-Zeitraum (historische Daten)
  training_lookback: "7d"          # Wie weit zurück Daten geladen werden

  # Prognose-Horizont für zukünftige Punkte
  forecast_horizon: "1h"

  # Feiertage & besondere Ereignisse (Prophet lernt deren Effekt automatisch)
  # Ohne diesen Block wird kein Feiertagsmodell verwendet.
  #
  # holidays:
  #   country: "DE"          # ISO-3166-1 Ländercode  (DE, AT, CH, ...)
  #   province: "BY"         # Optional: Bundesland-Kürzel
  #                          #   DE: BY BW BE BB HB HE HH MV NI NW RP SH SL SN ST TH
  #                          #   AT: 1 2 3 4 5 6 7 8 9  (Bundesländer-Nummern)
  #   custom:                # Optional: eigene wiederkehrende/einmalige Ereignisse
  #     - name: "Betriebsferien"
  #       dates:
  #         - "2025-08-04"
  #         - "2025-08-05"
  #       lower_window: 0    # Tage VOR dem Ereignis, die ebenfalls erfasst werden
  #       upper_window: 0    # Tage NACH dem Ereignis
  #     - name: "Black Friday"
  #       dates: ["2025-11-28"]
  #       lower_window: -1
  #       upper_window: 1

# Scheduling
scheduler:
  # Wie oft wird die Anomalie-Erkennung ausgeführt?
  interval_minutes: 5

  # Wann beginnt die Ausführung (now = sofort)
  start: "now"

# Alerting
alerting:
  enabled: true

  # Webhook für Alerts (z. B. Alertmanager, Slack)
  webhook:
    enabled: false
    url: "http://alertmanager:9093/api/v1/alerts"
    timeout: 10

  # Ausgabe in Datei
  log_anomalies: true
  log_file: "anomalies.log"

# Ergebnisse zurück nach VictoriaMetrics schreiben
writer:
  enabled: true
  # Anomalie-Score wird als neue Metrik geschrieben
  # metric_name_pattern: "<query_name>_anomaly_score"
  # Wert: 1 = Anomalie, 0 = Normal, 0-1 = Score
  metric_prefix: "vmanomaly"

# Logging
logging:
  level: "INFO"                    # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s [%(levelname)s] %(message)s"
  file: "vmanomaly.log"
